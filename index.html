<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdelrahman El-Adeeb — Graphic & Web Designer</title>
<meta name="description" content="Abdelrahman El-Adeeb — graphic designer and web designer. Brand identities, websites and UI.">
<meta name="theme-color" content="#1c0505">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23e10600'/><text x='32' y='45' font-size='36' text-anchor='middle' fill='%23f3e9d8' font-family='Georgia' font-style='italic'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@1&family=Cairo:wght@400;700;900&family=Amiri:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Abdelrahman El-Adeeb — Portfolio
   - غيّر بياناتك من كائن CFG في آخر الملف
   - الصورة: حطها بجانب الملف باسم me.jpg / me.png أو اضغط على مكانها وارفعها
   - صور الأعمال: work1.jpg  work2.jpg  work3.jpg بجانب الملف
   ============================================================ */
:root{
  --red:#e10600;--red2:#ff2a17;--deep:#1c0505;--ink:#120202;
  --cream:#f3e9d8;--mut:#b9a79a;--amber:#ffb27a;
  --sans:'Bricolage Grotesque','Segoe UI',Tahoma,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --ease:cubic-bezier(.2,.7,.2,1);--px:6vw;
}
html[dir=rtl]{--sans:'Cairo','Segoe UI',Tahoma,sans-serif;--serif:'Amiri',Georgia,serif}
html[dir=rtl] *{letter-spacing:0!important}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{background:var(--deep);color:var(--cream);font-family:var(--sans);overflow-x:hidden;line-height:1.55;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden;height:100vh}
::selection{background:var(--red);color:#fff}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--amber)}
html[dir=rtl] em{font-weight:700}
section{padding:120px var(--px);position:relative}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* grain + progress */
body::after{content:"";position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:150;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber),var(--red));transform:scaleX(0);transform-origin:0 50%;z-index:250}
html[dir=rtl] #bar{transform-origin:100% 50%}

/* cursor */
#cur,#ring{position:fixed;left:0;top:0;pointer-events:none;z-index:400;mix-blend-mode:difference;border-radius:50%}
#cur{width:8px;height:8px;background:#fff}
#ring{width:38px;height:38px;border:1px solid #fff;transition:width .35s var(--ease),height .35s var(--ease),background .3s}
#ring.big{width:74px;height:74px;background:#fff}
@media(hover:none),(pointer:coarse){#cur,#ring{display:none}}

/* tags / buttons */
.tag{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:30px}
html[dir=rtl] .tag{font-size:14px}
.tag i{width:40px;height:1px;background:var(--mut)}
.tag b{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:99px;background:var(--cream);color:#1c0505;font-weight:800;font-size:14px;border:1px solid var(--cream);transition:background .3s,color .3s,box-shadow .3s,transform .25s var(--ease)}
.btn:hover{box-shadow:0 12px 36px #e1060066}
.btn.ghost{background:transparent;color:var(--cream);border-color:#f3e9d855}
.btn.ghost:hover{background:var(--cream);color:#1c0505}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.mag{transition:transform .3s var(--ease),background .3s,color .3s,box-shadow .3s}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:16px var(--px);opacity:0;transition:transform .6s var(--ease),background .4s,opacity 1s .9s}
nav.scrolled{background:#1c0505d9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav.hide{transform:translateY(-110%)}
body.in nav{opacity:1}
.logo{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1}
html[dir=rtl] .logo{font-weight:700}
#links{display:flex;gap:30px;list-style:none;font-size:14px}
#links a{position:relative;opacity:.8;transition:.3s;padding:4px 0}
#links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--amber);transform:scaleX(0);transition:transform .4s var(--ease)}
#links a:hover,#links a.act{opacity:1;color:var(--amber)}
#links a:hover::after,#links a.act::after{transform:scaleX(1)}
.nav-r{display:flex;gap:12px;align-items:center}
.lang{padding:8px 16px;border:1px solid #f3e9d844;border-radius:99px;font-size:13px;font-weight:700;transition:.3s}
.lang:hover{background:var(--cream);color:#1c0505}
.burger{display:none;width:40px;height:40px;position:relative}
.burger span{position:absolute;left:9px;right:9px;height:2px;background:var(--cream);transition:.4s var(--ease)}
.burger span:nth-child(1){top:15px}.burger span:nth-child(2){top:23px}
.burger.open span:nth-child(1){top:19px;transform:rotate(45deg)}
.burger.open span:nth-child(2){top:19px;transform:rotate(-45deg)}
#menu{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;background:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 var(--px);transform:translateY(-100%);transition:transform .8s cubic-bezier(.77,0,.18,1)}
#menu.open{transform:none}
#menu a{font-size:clamp(36px,10vw,64px);font-weight:800;line-height:1.15}
#menu a.act{color:var(--amber)}
@media(max-width:900px){#links{display:none}.burger{display:block}}
@media(max-width:520px){.nav-r .btn{display:none}}

/* intro */
#intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;background:radial-gradient(ellipse at 50% 50%,#3a0606,#120202 75%);display:flex;align-items:center;justify-content:center;transition:transform 1.1s cubic-bezier(.77,0,.18,1);cursor:pointer}
#intro.out{transform:translateY(-100%)}
.i-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px var(--px);font-size:12px;letter-spacing:.15em;color:var(--mut);direction:ltr;text-transform:uppercase}
.i-top button{padding:7px 14px;border:1px solid #f3e9d844;border-radius:99px;font-size:12px;letter-spacing:0;text-transform:none}
.i-track{width:100%;overflow:hidden;direction:ltr;animation:rise 1.5s var(--ease) both;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
#itrack{display:flex;width:max-content;animation:mv 22s linear infinite;font-size:clamp(48px,10vw,140px);font-weight:800;white-space:nowrap;line-height:1.3;text-shadow:0 0 30px #ffb27a44;align-items:center}
#itrack span{padding:0 .25em;direction:rtl}
html[dir=ltr] #itrack span{direction:ltr}
#itrack i{display:inline-block;width:.14em;height:.14em;background:var(--red);box-shadow:0 0 14px var(--red)}
#enter{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;display:grid;place-items:center;transition:transform .45s var(--ease);z-index:3}
#enter::before{content:"";position:absolute;top:29px;right:29px;bottom:29px;left:29px;border-radius:50%;border:1px solid var(--red2);animation:halo 2.4s ease-out infinite;pointer-events:none}
#enter .ring-txt{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;animation:spin 16s linear infinite;fill:var(--cream);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.85;pointer-events:none}
html[dir=rtl] #enter .ring-txt{letter-spacing:0;font-size:13px}
#enter .core{position:relative;width:92px;height:92px;border-radius:50%;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;box-shadow:0 0 50px #e10600aa,inset 0 0 20px #ff6a4d66;transition:transform .45s var(--ease),color .35s}
#enter .core::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:var(--cream);transform:translateY(101%);border-radius:50%;transition:transform .55s var(--ease)}
#enter:hover .core,#enter:focus-visible .core{transform:scale(1.12);color:#1c0505}
#enter:hover .core::before,#enter:focus-visible .core::before{transform:translateY(0)}
#enter:active .core{transform:scale(.95)}
#enter .lbl{position:relative;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
html[dir=rtl] #enter .lbl{letter-spacing:0;font-size:15px}
#enter .ar{position:relative;font-style:normal;font-size:16px;line-height:1;transition:transform .4s var(--ease)}
#enter .ar::before{content:"\2192"}
html[dir=rtl] #enter .ar::before{content:"\2190"}
#enter:hover .ar{transform:translateX(4px)}
html[dir=rtl] #enter:hover .ar{transform:translateX(-4px)}
.burst{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;background:var(--red);transform:scale(1);transition:transform .9s cubic-bezier(.77,0,.18,1);pointer-events:none;z-index:2}
.burst.go{transform:scale(260)}
#intro.go .i-track,#intro.go .i-top{opacity:0;transition:opacity .4s}
#intro.go #enter .ring-txt,#intro.go #enter::before{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes halo{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.75);opacity:0}}
@keyframes rise{from{opacity:0;filter:blur(24px);transform:scale(.9)}}
@keyframes pulse{50%{box-shadow:0 0 80px #e10600}}
@keyframes mv{to{transform:translateX(-50%)}}

/* hero */
.hero{--gx:72%;min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:end;padding:130px var(--px) 0;overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse at var(--gx) 38%,#ff2a17 0%,#e10600 34%,#8a0300 78%,#3a0504 100%)}
html[dir=rtl] .hero{--gx:28%}
.hero::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;background:radial-gradient(540px circle at var(--mx,70%) var(--my,40%),#ff8a5c55,transparent 62%)}
.hero::after{content:"";position:absolute;top:auto;right:0;bottom:0;left:0;height:150px;background:linear-gradient(transparent,var(--deep));pointer-events:none;z-index:4}
.hero .txt{align-self:center;position:relative;z-index:5;padding-bottom:90px}
.hero h1{font-size:clamp(46px,8.2vw,128px);line-height:.95;font-weight:800;letter-spacing:-.035em}
html[dir=rtl] .hero h1{line-height:1.12;font-size:clamp(44px,7.4vw,112px)}
.ln{display:block;overflow:hidden;padding:.18em 0 .16em;margin:-.1em 0}
.ln>span{display:block;transform:translateY(115%);transition:transform 1.3s var(--ease)}
.ln:nth-child(1)>span{transition-delay:.55s}.ln:nth-child(2)>span{transition-delay:.7s}.ln:nth-child(3)>span{transition-delay:.85s}
.hero h1 em{color:var(--cream)}
body.in .ln>span{transform:none}
.role{font-size:12px;letter-spacing:.2em;text-transform:uppercase;display:flex;gap:12px;align-items:center;margin-bottom:22px}
html[dir=rtl] .role{letter-spacing:0;font-size:14px}
.role::before{content:"";width:46px;height:1px;background:var(--cream);opacity:.7}
.hero .sub{max-width:440px;margin:28px 0 32px;font-size:16px;color:#ffe9dd}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.role,.hero .sub,.hero .row{opacity:0;transform:translateY(30px);transition:1.1s var(--ease)}
.role{transition-delay:.4s}.hero .sub{transition-delay:1s}.hero .row{transition-delay:1.15s}
body.in .role,body.in .hero .sub,body.in .hero .row{opacity:1;transform:none}

.photo{position:relative;height:min(88vh,920px);width:100%;max-width:640px;justify-self:center;align-self:end;opacity:0;transform:translateY(90px);transition:1.6s var(--ease) .45s;z-index:2}
body.in .photo{opacity:1;transform:none}
.pin{position:absolute;top:0;right:0;bottom:0;left:0;transform:translate(var(--ox,0px),var(--oy,0px));transition:transform .4s ease-out}
.glow2{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse 70% 62% at 50% 42%,#ff4a30 0%,#e10600 55%,transparent 100%)}
.ph{position:absolute;top:0;right:0;bottom:0;left:0}
.ph svg{width:100%;height:100%;display:block}
.photo img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:none;
  -webkit-mask-image:radial-gradient(ellipse 72% 88% at 50% 54%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 72% 88% at 50% 54%,#000 58%,transparent 100%);
  filter:contrast(1.08) saturate(1.06)}
.photo.has img{display:block}.photo.has .ph{display:none}
.photo.cut img{object-fit:contain;object-position:50% 100%;-webkit-mask-image:none;mask-image:none;filter:contrast(1.08) saturate(1.05) drop-shadow(0 0 34px #ff2a17aa)}
.rim{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;mix-blend-mode:soft-light;background:radial-gradient(ellipse at 24% 38%,#ff2a1766,transparent 56%),linear-gradient(to top,#8a0300bb,transparent 30%)}
.upload{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:6;display:flex;gap:8px;align-items:center;padding:12px 22px;border-radius:99px;background:var(--cream);color:#1c0505;font-weight:800;font-size:14px;box-shadow:0 20px 60px #0007;pointer-events:none;white-space:nowrap;transition:.4s var(--ease)}
.photo.has .u1,.photo:not(.has) .u2{display:none}
.photo.has .upload{opacity:0;transform:translate(-50%,-30%)}
.photo.has:hover .upload{opacity:1;transform:translate(-50%,-50%)}
#file{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:7;font-size:0}
#file::file-selector-button{cursor:pointer}
.badge{position:absolute;bottom:60px;right:0;z-index:6;display:flex;gap:8px;align-items:center;padding:8px 16px;border-radius:99px;background:#1c05058c;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #f3e9d833;font-size:13px;pointer-events:none}
.dot{width:8px;height:8px;border-radius:50%;background:#3dff8a;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #3dff8aaa}100%{box-shadow:0 0 0 12px #3dff8a00}}
.cutbtn{position:absolute;top:10px;left:0;z-index:8;padding:7px 14px;border-radius:99px;background:#1c0505aa;border:1px solid #f3e9d844;font-size:12px;display:none;backdrop-filter:blur(8px)}
.photo.has .cutbtn{display:block}
@media(max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:110px}
  .hero .txt{padding-bottom:20px}
  .photo{height:64vh}
}

/* skills cloud */
.cloud{position:relative;height:300px;overflow:hidden;direction:ltr;border-bottom:1px solid #f3e9d812}
.pill{position:absolute;left:0;top:0;padding:10px 22px;border-radius:99px;background:#f3e9d8ee;color:#2a0808;font-weight:700;font-size:14px;white-space:nowrap;will-change:transform;box-shadow:0 10px 30px #0006}
.pill.r{background:var(--red);color:#fff;box-shadow:0 0 34px #e10600aa}

/* about */
.about{overflow:hidden}
.about::before{content:"";position:absolute;width:60vw;height:60vw;left:-15vw;top:-5vw;background:radial-gradient(circle,#e1060030,transparent 65%);pointer-events:none}
.about h2{position:relative;font-size:clamp(28px,4.6vw,68px);line-height:1.16;font-weight:800;letter-spacing:-.025em;max-width:1120px}
html[dir=rtl] .about h2{line-height:1.45}
.about h2 .w{color:#f3e9d82e;transition:color .35s,text-shadow .35s}
.about h2 .w.on{color:var(--cream);text-shadow:0 0 14px #ffb27a99,0 0 38px #e1060088}
.about h2 .w.edge{color:#fff;text-shadow:0 0 10px #fff,0 0 26px #ffb27a,0 0 60px #ff3b1f}
.stats{display:flex;gap:70px;margin-top:80px;flex-wrap:wrap;position:relative}
.stats b{display:block;font-size:clamp(48px,6vw,84px);font-weight:800;line-height:1;direction:ltr;unicode-bidi:isolate;text-align:start}
.stats small{color:var(--mut);font-size:14px}

/* generic big heading */
.big{font-size:clamp(42px,7.4vw,112px);line-height:.95;font-weight:800;letter-spacing:-.035em}
html[dir=rtl] .big{line-height:1.15}

/* services */
.svc-head{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end;margin-bottom:70px}
.svc-side{display:flex;gap:16px;align-items:flex-start;color:var(--mut);font-size:15px}
.svc-side>div{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.orb{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid #f3e9d855;display:grid;place-items:center}
.orb::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px var(--amber);animation:ping2 2.4s infinite}
@keyframes ping2{50%{transform:scale(.6);opacity:.6}}
@media(max-width:860px){.svc-head{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:70px 1.1fr 1.4fr 56px;gap:24px;align-items:center;padding:36px 0;border-top:1px solid #f3e9d822;position:relative;transition:padding .5s var(--ease)}
.row:last-child{border-bottom:1px solid #f3e9d822}
.row::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,#e1060044,transparent);opacity:0;transition:opacity .5s;pointer-events:none}
html[dir=rtl] .row::before{background:linear-gradient(270deg,#e1060044,transparent)}
.row:hover::before{opacity:1}.row:hover{padding-left:22px;padding-right:22px}
.row .n{font-family:var(--serif);font-style:italic;color:var(--amber);font-size:30px;position:relative}
.row h3{font-size:clamp(26px,3.4vw,48px);font-weight:800;line-height:1.08;position:relative}
.row p{color:var(--mut);font-size:15px;position:relative;margin-bottom:12px;max-width:520px}
.tg{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.tg span{padding:4px 13px;border:1px solid #f3e9d83a;border-radius:99px;font-size:12px;color:var(--cream)}
.arr{width:50px;height:50px;border-radius:50%;border:1px solid #f3e9d844;display:grid;place-items:center;position:relative;transition:.4s var(--ease);justify-self:end}
.arr::before{content:"↗";font-size:18px}
html[dir=rtl] .arr::before{content:"↖"}
.row:hover .arr{background:var(--cream);color:#1c0505;transform:rotate(45deg)}
@media(max-width:860px){.row{grid-template-columns:44px 1fr;gap:10px 16px}.row p,.row .tg{grid-column:2}.arr{display:none}.row>div{grid-column:2}}

/* work */
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
@media(max-width:980px){.works{grid-template-columns:1fr}}
.proj{display:block;perspective:1100px}
.frame{transition:transform .25s ease-out;transform-style:preserve-3d}
.proj .img{height:0;padding-top:82.5%;border-radius:18px;background:var(--img,none) center/cover no-repeat,var(--g);position:relative;overflow:hidden;box-shadow:0 30px 60px #0009}
.proj .img::after{content:attr(data-view) " ↗";position:absolute;right:14px;bottom:14px;background:var(--cream);color:#1c0505;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:800;opacity:0;transform:translateY(10px);transition:.35s var(--ease)}
html[dir=rtl] .proj .img::after{content:attr(data-view) " ↖"}
.proj:hover .img::after{opacity:1;transform:none}
.proj .top{display:flex;gap:14px;align-items:baseline;margin:22px 0 12px}
.proj .num{font-family:var(--serif);font-style:italic;font-size:34px;color:var(--amber);line-height:1}
.proj h3{font-size:26px;line-height:1.15}
.proj .tools{color:var(--mut);font-size:13px;margin-top:4px;direction:ltr;text-align:start}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:980px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.steps{grid-template-columns:1fr}}
.step{padding:30px 26px 34px;border-radius:20px;background:linear-gradient(160deg,#2b0707,#170303);border:1px solid #f3e9d81a;overflow:hidden;transition:.5s var(--ease)}
.step:hover{transform:translateY(-8px);border-color:var(--red);box-shadow:0 24px 60px #e1060033}
.step .nm{font-size:96px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1px #f3e9d84d;direction:ltr;text-align:start}
.step h3{margin:30px 0 8px;font-size:24px}
.step p{color:var(--mut);font-size:15px}

/* experience */
.it{display:grid;grid-template-columns:minmax(0,1.1fr) 130px 44px minmax(0,1.4fr);gap:0 24px;align-items:stretch}
.it .who,.it .yr,.it p{align-self:center;padding:36px 0}
.it h3{font-size:clamp(20px,2.4vw,28px);line-height:1.2}
.it small{color:#ff7a5c;font-size:14px}
.it .yr{font-size:clamp(30px,4vw,52px);font-weight:800;line-height:1;transition:color .4s}
.it:hover .yr{color:var(--amber)}
.it p{color:var(--mut);font-size:15px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#f3e9d833}
.rail::after{content:"";position:absolute;left:calc(50% - .5px);top:0;width:2px;height:calc(var(--f,0)*100%);background:linear-gradient(var(--amber),var(--red));box-shadow:0 0 12px var(--red)}
.rail i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#2a0808;border:2px solid #f3e9d855;transition:.4s;z-index:2}
.it.on .rail i{background:var(--red);border-color:var(--amber);box-shadow:0 0 20px var(--red)}
@media(max-width:760px){.it{grid-template-columns:36px 1fr}.it .yr{grid-column:2;grid-row:1;padding:26px 0 0}.it .who{grid-column:2;grid-row:2;padding:6px 0 0}.it p{grid-column:2;grid-row:3;padding:6px 0 26px}.rail{grid-column:1;grid-row:1/4}}

/* contact */
.contact{min-height:100vh;display:grid;place-items:center;text-align:center;overflow:hidden;padding-bottom:90px}
.glow{position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#ff1a0e 0%,#e10600aa 40%,transparent 70%);filter:blur(30px);left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;transition:left .7s ease-out,top .7s ease-out}
.contact .in{position:relative;display:flex;flex-direction:column;align-items:center}
.contact h2{font-size:clamp(42px,8.4vw,128px);line-height:.95;font-weight:800;letter-spacing:-.035em;max-width:1100px}
html[dir=rtl] .contact h2{line-height:1.15}
.contact h2 em{color:var(--cream)}
.mailrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:36px}
.mail{display:inline-block;font-size:clamp(16px,2.4vw,26px);padding:14px 30px;border-radius:99px;background:#0005;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #f3e9d844;direction:ltr}
.mail:hover{background:var(--cream);color:#1c0505}
.copy{padding:14px 22px;border-radius:99px;border:1px solid #f3e9d844;font-size:14px;background:#0005}
.copy:hover{background:var(--cream);color:#1c0505}
.soc{display:flex;gap:26px;margin-top:44px;font-size:14px;color:#ffd9cc;flex-wrap:wrap;justify-content:center}
.soc a{position:relative;padding:2px 0}.soc a:hover{color:#fff}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);background:var(--cream);color:#1c0505;padding:12px 22px;border-radius:99px;font-weight:800;font-size:14px;opacity:0;transition:.4s var(--ease);z-index:300;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:28px var(--px);font-size:13px;color:var(--mut);border-top:1px solid #f3e9d81a}
footer a:hover{color:var(--cream)}


/* ===== button press: cinematic red (no blue flash) ===== */
button,a,.btn,#enter,.lang,.copy,.mail,.burger{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#intro{-webkit-user-select:none;user-select:none;cursor:default}
button:focus,a:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.btn,.lang,.copy,.mail,.i-top button{position:relative;overflow:hidden;isolation:isolate}
.btn:active,.lang:active,.copy:active,.mail:active,.i-top button:active,.cutbtn:active{box-shadow:0 0 0 4px #e1060044,0 12px 44px #e10600cc;filter:brightness(.96)}
.btn.red:active{box-shadow:0 0 0 4px #ff2a1755,0 12px 50px #ff2a17dd}
.rip{position:absolute;border-radius:50%;pointer-events:none;z-index:0;transform:scale(0);opacity:.95;
  background:radial-gradient(circle,#ff3b22 0%,#e10600cc 38%,#8a030066 62%,transparent 72%);
  animation:rip .75s cubic-bezier(.2,.7,.2,1) forwards}
.btn.red .rip,#enter .rip{background:radial-gradient(circle,#ffd9c9 0%,#ff6a4d99 38%,#e1060044 62%,transparent 72%)}
.btn>*,.lang>*,.copy>*{position:relative;z-index:1}
@keyframes rip{to{transform:scale(1);opacity:0}}

html[dir=rtl] .badge{right:auto;left:0}

[data-in].show{opacity:1;transform:none}

  $('#workList').innerHTML=tr('works').map((w,i)=>`<a class="proj" href="#contact" data-in><div class="frame"><div class="img" data-view="${tr('view')}" style="--img:url(work${i+1}.jpg);--g:${GR[i]}"></div></div><div class="top"><span class="num">0${i+1}</span><div><h3>${w.t}</h3><div class="tools">${w.tools}</div></div></div><div class="tg">${w.g.map(x=>`<span>${x}</span>`).join('')}</div></a>`).join('');
  $('#stepList').innerHTML=tr('steps').map((s,i)=>`<div class="step" data-in><div class="nm">0${i+1}</div><h3>${s.t}</h3><p>${s.d}</p></div>`).join('');
  $('#expList').innerHTML=tr('exp').map(e=>`<div class="it" data-in><div class="who"><h3>${e.r}</h3><small>${e.c}</small></div><div class="yr">${e.y}</div><div class="rail"><i></i></div><p>${e.d}</p></div>`).join('');
  $('#soc').innerHTML=CFG.social.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join('');
  $('#mail').textContent=CFG.email;$('#mail').href='mailto:'+CFG.email;
  $('#itrack').innerHTML=Array(8).fill(`<span>${tr('name')}</span><i></i>`).join('');
  const a=$('#aboutText');a.innerHTML=tr('about').split(/\s+/).map(w=>`<span class="w">${w}</span>`).join(' ');
  words=[...a.querySelectorAll('.w')];
  buildCloud();updCut();bindTilt();reveal();hl();onScroll();
  try{localStorage.setItem('adeeb_lang',l)}catch(e){}
}

/* about glow */
let words=[];
function hl(){const a=$('#aboutText');if(!a)return;const r=a.getBoundingClientRect(),h=innerHeight;
  const p=Math.min(1,Math.max(0,(h*.85-r.top)/(r.height+h*.35))),k=Math.ceil(p*words.length);
  words.forEach((w,i)=>{w.classList.toggle('on',i<k);w.classList.toggle('edge',i<k&&i>=k-3)})}

/* reveal + counters */
function count(el){const t=+el.dataset.count,t0=performance.now();
  (function s(n){const p=Math.min(1,(n-t0)/1500),e=1-Math.pow(1-p,3);el.textContent=Math.round(t*e)+'+';if(p<1)requestAnimationFrame(s)})(t0)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add('show');
  el.querySelectorAll('[data-count]').forEach(count);io.unobserve(el)}),{threshold:.12});
function reveal(){$$('[data-in]:not(.show)').forEach(e=>io.observe(e))}

/* skills cloud (arc of pills that moves with scroll) */
let pills=[],off=0,cy=scrollY;
function buildCloud(){const c=$('#cloud');c.innerHTML='';
  pills=tr('skills').map((s,i)=>{const p=document.createElement('span');p.className='pill'+(i%3===1?' r':'');p.textContent=s;c.appendChild(p);return p})}
function loop(){
  const c=$('#cloud'),W=c.clientWidth,H=c.clientHeight,gap=W<600?150:210,total=pills.length*gap;
  off+=.5+(scrollY-cy)*.45;cy=scrollY;
  pills.forEach((p,i)=>{
    const x=(((i*gap+off)%total)+total)%total-gap,t=Math.min(1,Math.max(0,(x+gap/2)/W)),
    y=18+(H-110)*Math.pow(2*t-1,2),rot=Math.atan(2*(H-110)*(2*t-1)*2/W)*180/Math.PI;
    p.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg)`});
  requestAnimationFrame(loop)}

/* scroll: progress bar, nav, active link, timeline */
let lastY=0,tick=false;
function onScroll(){
  const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
  $('#bar').style.transform=`scaleX(${max>0?y/max:0})`;
  const n=$('#nav');n.classList.toggle('scrolled',y>40);
  n.classList.toggle('hide',y>lastY&&y>300&&!$('#menu').classList.contains('open'));lastY=y;
  let act='';SECS.forEach(s=>{const e=document.getElementById(s);if(e&&e.getBoundingClientRect().top<innerHeight*.4)act=s});
  $$('#links a,#menu a').forEach(a=>a.classList.toggle('act',a.dataset.s===act));
  $$('.it').forEach(it=>{const r=it.getBoundingClientRect(),f=Math.min(1,Math.max(0,(innerHeight*.62-r.top)/r.height));
    it.style.setProperty('--f',f.toFixed(3));it.classList.toggle('on',f>.02)});
  hl();
}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(()=>{onScroll();tick=false})}},{passive:true});
addEventListener('resize',onScroll);

/* project tilt */
function bindTilt(){$$('.proj').forEach(p=>{const f=p.querySelector('.frame');
  p.addEventListener('mousemove',e=>{const r=p.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;f.style.transform=`rotateY(${x*10}deg) rotateX(${-y*10}deg)`});
  p.addEventListener('mouseleave',()=>f.style.transform='')})}

/* cursor + hero light + glow + magnetic */
const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
if(fine){
  const cur=$('#cur'),ring=$('#ring');let mx=0,my=0,rx=0,ry=0;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`});
  (function f(){rx+=(mx-rx)*.18;ry+=(my-ry)*.18;ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;requestAnimationFrame(f)})();
  document.addEventListener('mouseover',e=>ring.classList.toggle('big',!!e.target.closest('a,button,.row,.proj,.photo,label')));
  document.addEventListener('mousemove',e=>{
    const hero=$('.hero'),r=hero.getBoundingClientRect();
    if(r.bottom>0){hero.style.setProperty('--mx',(e.clientX-r.left)+'px');hero.style.setProperty('--my',(e.clientY-r.top)+'px');
      const pin=$('#pin');pin.style.setProperty('--ox',((e.clientX/innerWidth-.5)*-16)+'px');pin.style.setProperty('--oy',((e.clientY/innerHeight-.5)*-10)+'px')}
    const c=$('#contact').getBoundingClientRect();
    if(c.top<innerHeight&&c.bottom>0){const g=$('#glow');g.style.left=(e.clientX-c.left)+'px';g.style.top=(e.clientY-c.top)+'px'}
    const m=e.target.closest&&e.target.closest('.mag');
    $$('.mag').forEach(b=>{if(b!==m)b.style.transform=''});
    if(m){const q=m.getBoundingClientRect();m.style.transform=`translate(${(e.clientX-q.left-q.width/2)*.25}px,${(e.clientY-q.top-q.height/2)*.35}px)`}
  });
}

/* copy email + toast */
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2000)}
$('#copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(CFG.email)}catch(e){const t=document.createElement('textarea');t.value=CFG.email;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove()}
  toast(tr('copied'))};

/* menu */
$('#burger').onclick=()=>{$('#burger').classList.toggle('open');$('#menu').classList.toggle('open')};
$('#menu').addEventListener('click',e=>{if(e.target.closest('a')){$('#burger').classList.remove('open');$('#menu').classList.remove('open')}});

/* language */
const flip=e=>{if(e)e.stopPropagation();applyLang(L==='en'?'ar':'en')};
$('#lang').onclick=flip;$('#ilang').onclick=flip;

/* =================== الصورة =================== */
const img=$('#me'),box=$('#photoBox'),inp=$('#file'),cbtn=$('#cutbtn');
let srcOrig=null,cutOn=true,busy=0;
try{cutOn=localStorage.getItem('adeeb_cut')!=='0'}catch(e){}
function updCut(){cbtn.textContent=cutOn?tr('cut_on'):tr('cut_off')}

/* إزالة خلفية تلقائية (للخلفيات الموحدة) */
function cutout(src,cb){
  const im=new Image();
  im.onload=()=>{try{
    const s=Math.min(1,1000/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
    const d=x.getImageData(0,0,w,h),p=d.data,pts=[];
    for(let i=0;i<w;i+=3)pts.push(i);
    for(let j=0;j<h*.6;j+=3){pts.push(j*w);pts.push(j*w+w-1)}
    let r=0,g=0,b=0,a=0;pts.forEach(i=>{const k=i*4;r+=p[k];g+=p[k+1];b+=p[k+2];a+=p[k+3]});
    const n=pts.length;r/=n;g/=n;b/=n;a/=n;
    if(a<200){cb(null,'transparent');return}
    const T2=46*46,dist=i=>{const k=i*4,dr=p[k]-r,dg=p[k+1]-g,db=p[k+2]-b;return dr*dr+dg*dg+db*db};
    let far=0;pts.forEach(i=>{if(dist(i)>T2*2.2)far++});
    if(far/n>.35){cb(null,'fail');return}
    const seen=new Uint8Array(w*h),st=new Int32Array(w*h);let sp=0;
    const push=i=>{if(!seen[i]&&dist(i)<T2){seen[i]=1;st[sp++]=i}};
    pts.forEach(push);
    while(sp){const i=st[--sp],cx=i%w,cy2=(i-cx)/w;
      if(cx>0)push(i-1);if(cx<w-1)push(i+1);if(cy2>0)push(i-w);if(cy2<h-1)push(i+w)}
    const er=new Uint8Array(w*h);let rem=0;
    for(let i=0;i<w*h;i++)if(seen[i]){rem++;er[i]=1;const cx=i%w;
      if(cx>0)er[i-1]=1;if(cx<w-1)er[i+1]=1;if(i>=w)er[i-w]=1;if(i<w*h-w)er[i+w]=1}
    if(rem/(w*h)<.1||rem/(w*h)>.88){cb(null,'fail');return}
    for(let i=0;i<w*h;i++)if(er[i])p[i*4+3]=0;
    x.putImageData(d,0,0);
    try{const m=document.createElement('canvas');m.width=w;m.height=h;const mx2=m.getContext('2d');mx2.filter='blur(1.3px)';mx2.drawImage(c,0,0);x.globalCompositeOperation='destination-in';x.drawImage(m,0,0)}catch(e){}
    c.toBlob(bl=>bl?cb(URL.createObjectURL(bl),'ok'):cb(null,'fail'),'image/png');
  }catch(e){cb(null,'fail')}};
  im.onerror=()=>cb(null,'fail');im.src=src}

function paint(){
  if(!srcOrig)return;const id=++busy;
  const done=(u,isCut)=>{if(id!==busy)return;img.src=u;box.classList.toggle('cut',!!isCut);box.classList.add('has')};
  if(!cutOn){done(srcOrig,false);return}
  cutout(srcOrig,(u,st)=>{if(st==='ok')done(u,true);else if(st==='transparent')done(srcOrig,true);else done(srcOrig,false)})}

function take(f){
  if(!f||!/^image\//.test(f.type))return;
  srcOrig=URL.createObjectURL(f);paint();
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{try{
    const s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    localStorage.setItem('adeeb_photo',c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.88))}catch(e){}};im.src=fr.result};
  fr.readAsDataURL(f)}
inp.addEventListener('change',()=>{take(inp.files&&inp.files[0]);inp.value=''});
box.addEventListener('dragover',e=>e.preventDefault());
box.addEventListener('drop',e=>{e.preventDefault();take(e.dataTransfer.files[0])});
cbtn.addEventListener('click',e=>{e.stopPropagation();cutOn=!cutOn;try{localStorage.setItem('adeeb_cut',cutOn?'1':'0')}catch(_){}updCut();paint()});

/* تحميل الصورة: المحفوظة ثم me.jpg / me.png ... بجانب الملف */
(function init(){
  let sv=null;try{sv=localStorage.getItem('adeeb_photo')}catch(e){}
  if(sv){srcOrig=sv;paint();return}
  const C=['me.jpg','me.jpeg','me.png','me.webp','photo.jpg','photo.jpeg','photo.png','photo.webp'];
  (function probe(i){if(i>=C.length)return;const q=new Image();q.onload=()=>{srcOrig=C[i];paint()};q.onerror=()=>probe(i+1);q.src=C[i]})(0)
})();

/* =================== شاشة الدخول =================== */
let entered=false;
function enter(){if(entered)return;entered=true;
  const intro=$('#intro'),b=$('#enter').getBoundingClientRect(),d=document.createElement('div');
  d.className='burst';d.style.left=(b.left+b.width/2)+'px';d.style.top=(b.top+b.height/2)+'px';
  intro.appendChild(d);intro.classList.add('go');requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('go')));
  setTimeout(()=>{scrollTo(0,0);intro.classList.add('out');document.body.classList.remove('lock')},650);
  setTimeout(()=>document.body.classList.add('in'),1250);
  setTimeout(()=>intro.remove(),2100)}
$('#intro').addEventListener('mousemove',e=>{const bt=$('#enter'),dx=e.clientX-innerWidth/2,dy=e.clientY-innerHeight/2;
  bt.style.transform=Math.hypot(dx,dy)<190?`translate(${dx*.3}px,${dy*.3}px)`:''});
$('#enter').addEventListener('click',e=>{e.stopPropagation();enter()});
addEventListener('keydown',e=>{if(!entered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();enter()}});

/* red ripple on every button press */
document.addEventListener('pointerdown',e=>{
  let t=e.target.closest&&e.target.closest('.btn,.lang,.copy,.mail,.i-top button,.cutbtn,#enter');
  if(!t)return;
  const host=t.id==='enter'?t.querySelector('.core'):t;
  const r=host.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.6,x=document.createElement('span');
  x.className='rip';x.style.width=x.style.height=d+'px';
  x.style.left=(e.clientX-r.left-d/2)+'px';x.style.top=(e.clientY-r.top-d/2)+'px';
  host.appendChild(x);setTimeout(()=>x.remove(),800)},{passive:true});

applyLang(L);
requestAnimationFrame(loop);
</script>
